# tool-name の設定例（スキーマ: src/tool_name/schemas/config.schema.json）
max_line_length: 100
forbidden:
  - id: no-todo
    pattern: "TODO|FIXME"
    severity: warning
    message: 未完了の記述があります
    suggestion: 対応するか Issue に切り出してください
  - id: no-internal-url
    pattern: "https?://[a-z0-9.-]+\\.(internal|corp|local)\\b"
    severity: error
    message: 社内 URL が含まれています
