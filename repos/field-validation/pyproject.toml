[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "field-validation"
version = "0.2.0"
description = "構造化データ（表/YAML/JSON/抽出済み項目）の項目間整合性を宣言的ルールで検証する単機能ツール"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "devtools-common @ git+https://github.com/<your-org>/devtools-common.git@v0.2.0",
  "PyYAML>=6.0",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
fieldcheck = "field_validation.cli:entrypoint"

# カスタムルールを別パッケージで配布する場合の拡張点:
# [project.entry-points."field_validation.rules"]
# my_rules = "my_package.rules"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
