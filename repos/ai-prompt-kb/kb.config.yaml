# ナレッジベースのルール定義（SSOT）
# scripts/kb.py の validate / catalog / dist はすべてこのファイルを参照する。
# ルールを変えるときはこのファイルだけを編集し、PR でレビューする。

name: ai-prompt-kb
prompts_dir: docs/prompts

front_matter:
  required: [id, title, description, category, tags, status, version, owner, updated, depends_on]
  statuses: [draft, review, published, deprecated]
  # 配布パッケージ (dist) に含めるステータス
  distributable_statuses: [published]

categories:
  foundation: 土台・リポジトリ運用
  docs: ドキュメント基盤・学習資料
  ai-dev: AI 駆動開発
  tools: 開発支援ツール

prompt_body:
  # プロンプト本文（```text / ````text ブロック）に必須の見出し
  required_sections:
    - "# 私が埋める前提"
    - "# 出力"
  # クリーンルーム原則: 本文に必ず含める文言
  required_phrases:
    - 特定企業の写しにはしないこと
  # プレースホルダ書式（利用者が埋める箇所）
  placeholder_pattern: "\\{\\{[^{}]+\\}\\}"

# 固有名・機密の混入を防ぐ禁止パターン（正規表現, 大文字小文字無視）
# 自組織の社名・内部パッケージ名・ジョブ ID 体系・社内ドメインなどを追記すること。
# ※ このファイル自体は検査対象外。
forbidden_patterns:
  - pattern: "AKIA[0-9A-Z]{16}"
    reason: AWS アクセスキーらしき文字列
  - pattern: "-----BEGIN [A-Z ]*PRIVATE KEY-----"
    reason: 秘密鍵
  - pattern: "gh[pousr]_[A-Za-z0-9]{36,}"
    reason: GitHub トークン
  - pattern: "xox[baprs]-[A-Za-z0-9-]{10,}"
    reason: Slack トークン
  - pattern: "(password|passwd|secret|api[_-]?key)\\s*[:=]\\s*['\"]?[A-Za-z0-9/+_\\-]{8,}"
    reason: 認証情報の直書き
  - pattern: "https?://[a-z0-9.-]+\\.(internal|corp|local|intra)(/|\\b)"
    reason: 社内ドメインの URL
  # - pattern: "<your-company-name>"
  #   reason: 自社名
