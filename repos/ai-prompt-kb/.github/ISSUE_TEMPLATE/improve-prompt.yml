name: プロンプト改善提案
description: 既存プロンプトを使って気づいた改善点を提案する
title: "[improve] "
labels: [prompt, improvement]
body:
  - type: input
    id: prompt
    attributes:
      label: 対象プロンプト（id と version）
      placeholder: 例 03 / 1.0.0
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: 起きたこと
      description: どんな前提で投入し、生成物のどこが期待と違ったか（一般化して記載）
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 改善案
      description: 本文のどこをどう変えるとよいか
  - type: dropdown
    id: impact
    attributes:
      label: 影響の大きさ
      options:
        - PATCH（言い回し・誤字）
        - MINOR（設計項目・品質基準の追加）
        - MAJOR（前提・出力の構造変更）
