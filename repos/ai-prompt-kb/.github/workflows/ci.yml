name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Knowledge base rules (front matter / clean-room / forbidden patterns / catalog)
        run: python scripts/kb.py validate
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: markdownlint (blocking)
        run: npm run lint:md
      - name: textlint (advisory — .textlintrc.json を調整したら continue-on-error を外す)
        run: npm run lint:text
        continue-on-error: true

  docs-build:
    name: docs-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build site (strict = warnings are errors, catches broken links)
        run: mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: site/
          retention-days: 7
