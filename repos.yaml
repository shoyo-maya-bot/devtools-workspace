# マルチレポのマニフェスト（リポジトリ一覧の正の情報源）
# 新しいリポジトリを作ったら、ここに 1 件追加する（bootstrap・VS Code ワークスペース・README の一覧がこれを使う。armory/index.html の ITEMS にも足す）
#   role: workspace（このリポ）/ library（共有ライブラリ）/ tool（Python の CLI）/ app（常駐するアプリ）/
#         environment（開発環境・サンプルアプリ）/ guide（ガイドライン・テンプレート）/ docs（教材・資料）/ slides（スライド）/
#         lab（実験）/ platform（クラウドに置く基盤）/ org-standard（アカウント共通の既定ファイル）
#   python: true のものは `bootstrap.py install` で共有の仮想環境に入る
#   packages: 任意。Python のパッケージがサブフォルダにあるときの相対パス（カンマ区切り。書かなければリポジトリ直下）
#   ref: 任意。clone / pull で取り出すブランチ・タグ・コミット SHA（書かなければ既定ブランチ）
org: shoyo-maya-bot
host: https://github.com

repos:
  - name: devtools-workspace
    role: workspace
    description: 親ワークスペース（このリポジトリ）。マニフェスト・一括操作・パイプライン例・共通 CI

  - name: .github
    role: org-standard
    description: アカウント共通の既定ファイル（PR・Issue テンプレート、CONTRIBUTING など。今後使うときのために残す）

  - name: devtools-common
    role: library
    python: true
    description: 共有ライブラリ（CLI 規約・ログ・一時ファイル・HTTP・レポート）

  - name: dev-environment
    role: environment
    description: ローカル（docker compose）とクラウド（Terraform）の開発環境、Spring Boot のサンプルアプリ

  - name: ai-coding
    role: guide
    python: true
    packages: tools/spec-trace
    description: AI と進める設計 → 実装 → 単体テスト → レビューの手順・品質ゲート・エージェント・対応表（spec-trace 同梱）

  - name: doc-to-markdown
    role: tool
    python: true
    cli: doc2md
    description: Office / PDF / draw.io を Markdown に変換（変換ロスの検知、llms.txt、figspec で YAML → draw.io）

  - name: office-review
    role: tool
    python: true
    cli: harness
    description: 設計資料のレビューハーネス（観点・マルチロール・指摘の蓄積とダッシュボード）。表の項目間検証 fieldcheck を同梱

  - name: design-diff
    role: tool
    python: true
    cli: design-diff
    description: Excel 設計書の新旧差分と、API 定義書（Excel）と OpenAPI の整合チェック

  - name: quality-analytics
    role: tool
    python: true
    cli: qa
    description: レビュー指摘を集めて分類（欠陥・ノイズ・確認／観点／真因）し、傾向を分析（LLM API は任意・有料）

  - name: office-replace
    role: tool
    python: true
    cli: office-replace
    description: Excel / Word / PowerPoint の文字列・図形・シート名・ファイル名をワイルドカードで一括置換

  - name: backlog-report
    role: tool
    python: true
    cli: backlog-report
    description: Backlog の進捗レポート（遅延・担当者別・ガント・バーンダウン）を Slack と Wiki へ

  - name: slack-agenda-bot
    role: app
    python: true
    description: 定例会議のアジェンダを /agenda で集めて Canvas にまとめる Slack ボット（DynamoDB）

  - name: slide-tool
    role: slides
    description: Marp + Tailwind でスライドを Markdown から作る（レイアウト集・はみ出しチェック・PDF / PPTX）

  - name: learning-materials
    role: docs
    description: 開発者向け教材（環境構築・基礎・実ソース読解・API・非同期・設計品質）。GitHub Pages で公開

  - name: agent-lab
    role: lab
    python: true
    packages: auto-review,mcp-server
    description: AI エージェントの実験（MCP・自律度・マルチモデルの相互レビュー）。設計の段階

  - name: review-platform
    role: platform
    python: true
    description: 設計書とコードの差分を AI でレビューする基盤（API と MCP、ローカル・AWS・Azure で同じコード、Terraform 付き）。AWS・Azure・MCP の学習の題材
