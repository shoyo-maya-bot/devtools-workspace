# 統合 CI（ci.yml の windows・setup-sh ジョブ）が取り出すリポジトリと版（repos.yaml と同じ書き方）
# 他のリポジトリの main が変わってもこのリポジトリの CI が落ちたり結果が変わったりしないよう、ref をコミット SHA で固定する。
# 上げるとき: 各リポジトリの main の SHA に書き換えて PR を出す（CI がその組み合わせで setup を通すことを確かめる）。
# 項目は repos.yaml の一部で、name・role・python・cli・packages は repos.yaml と同じにする（tests/test_bootstrap.py で確かめる）。
# repos.yaml の python: true のリポジトリはすべてここに入れる（全ツールの一括インストールを CI で通すため。同じテストで確かめる）
org: shoyo-maya-bot
host: https://github.com

repos:
  - name: devtools-common
    role: library
    python: true
    ref: cbe97d5c9960d3eb26c853b9b3c9f271be73e0a1

  - name: ai-coding
    role: guide
    python: true
    packages: tools/spec-trace
    ref: 8770cf1a77327f9f60ae9d9fd6b34c46bee1ccae

  - name: doc-to-markdown
    role: tool
    python: true
    cli: doc2md
    ref: dc05a4068380bd3297b5937323d8ebd17d8b5fb3

  - name: office-review
    role: tool
    python: true
    cli: harness
    ref: 7495435f74545b162158057e28e328fe62ef2b74

  - name: design-diff
    role: tool
    python: true
    cli: design-diff
    ref: 4bad86497034ecdb92faab00c07e21c59223290d

  - name: quality-analytics
    role: tool
    python: true
    cli: qa
    ref: 46435f77b148d9975d95f84fc0fc35f325cfdb15

  - name: office-replace
    role: tool
    python: true
    cli: office-replace
    ref: a26f8613ac16ef92c27dda721e333b75c332d3e9

  - name: backlog-report
    role: tool
    python: true
    cli: backlog-report
    ref: 9e27569f69b2d1ec411142044864464f8304e5db

  - name: slack-agenda-bot
    role: app
    python: true
    ref: b4727d631cfe3a575e4015f49838565d0173bb40

  - name: agent-lab
    role: lab
