# 統合 CI（ci.yml の windows・setup-sh ジョブ）が取り出すリポジトリと版（repos.yaml と同じ書き方）
# 他のリポジトリの main が変わってもこのリポジトリの CI が落ちたり結果が変わったりしないよう、ref をコミット SHA で固定する。
# 上げるとき: 各リポジトリの main の SHA に書き換えて PR を出す（CI がその組み合わせで setup を通すことを確かめる）。
# 項目は repos.yaml の一部で、name・role・python・cli・packages は repos.yaml と同じにする（tests/test_bootstrap.py で確かめる）。
# repos.yaml の python: true のリポジトリはすべてここに入れる（全ツールの一括インストールを CI で通すため。同じテストで確かめる）
org: shoyo-maya-bot
host: https://github.com

repos:
  - name: devtools-common
    role: library
    python: true
    ref: 2e25f8a11717ab387c7c2174d2a06b1a5eb37713

  - name: ai-coding
    role: guide
    python: true
    packages: tools/spec-trace
    ref: 3e7cf8e6312658a724b9f9b5f04d5d0beef72bc2

  - name: doc-to-markdown
    role: tool
    python: true
    cli: doc2md
    ref: 24958948fbcee639026b209d5f18e176a41849d6

  - name: office-review
    role: tool
    python: true
    cli: harness
    ref: 2e9a44ba97adeb409f8fc9c6944c1a13a55e3c34

  - name: design-diff
    role: tool
    python: true
    cli: design-diff
    ref: 4117b2dfa3d25176a635645f4a254f8a2735e72a

  - name: quality-analytics
    role: tool
    python: true
    cli: qa
    ref: 58720f09b78abf6bc024901648b654ec17348579

  - name: office-replace
    role: tool
    python: true
    cli: office-replace
    ref: a6bd87af83051c05c2250bb149d514be55e6c2bb

  - name: backlog-report
    role: tool
    python: true
    cli: backlog-report
    ref: 1fd276c67d417a76c61bcf45c9478148283befa2

  - name: slack-agenda-bot
    role: app
    python: true
    ref: 39565f891e49ec8c25e79a7d66bbd2984fc0b524

  - name: agent-lab
    role: lab
    python: true
    packages: auto-review,mcp-server
    ref: b19e32e2a86666ac2211d9208fdfa3be0fd40b91

  - name: review-platform
    role: platform
    python: true
    ref: 006b62002a0d3bd3ef5741871f50f964f0ffa812
