# 統合 CI（ci.yml の windows・setup-sh ジョブ）が取り出すリポジトリと版（repos.yaml と同じ書き方）
# 他のリポジトリの main が変わってもこのリポジトリの CI が落ちたり結果が変わったりしないよう、ref をコミット SHA で固定する。
# 上げるとき: 各リポジトリの main の SHA に書き換えて PR を出す（CI がその組み合わせで setup を通すことを確かめる）。
# 項目は repos.yaml の一部で、name・role・python・cli・packages は repos.yaml と同じにする（tests/test_bootstrap.py で確かめる）。
# repos.yaml の python: true のリポジトリはすべてここに入れる（全ツールの一括インストールを CI で通すため。同じテストで確かめる）
org: shoyo-maya-bot
host: https://github.com

repos:
  - name: devtools-common
    role: library
    python: true
    ref: 6a263b894409a19a186d2b3b0b41da998174c0d6

  - name: ai-coding
    role: guide
    python: true
    packages: tools/spec-trace
    ref: 4c11d68f670a3e926397a3a499139ec0ba39148a

  - name: doc-to-markdown
    role: tool
    python: true
    cli: doc2md
    ref: 5a1e16c97d08049abdd4805f445ca8d15d1207c0

  - name: office-review
    role: tool
    python: true
    cli: harness
    ref: 7baa571e8da46d23388ec9b4437eeae563810d3b

  - name: design-diff
    role: tool
    python: true
    cli: design-diff
    ref: 20ca1cb22aac4076734794e6bfdbab78db289185

  - name: quality-analytics
    role: tool
    python: true
    cli: qa
    ref: 23bfa23225df308c3b47c6d838bcd3a4dfcfdde5

  - name: office-replace
    role: tool
    python: true
    cli: office-replace
    ref: 1e328a99651835683dd60f1044156f2af41237d0

  - name: backlog-report
    role: tool
    python: true
    cli: backlog-report
    ref: ddd5afbb827825811295f8cdac5e2064e795917f

  - name: slack-agenda-bot
    role: app
    python: true
    ref: bebe1240aeddcc2f9f2a05f433d71091a11fa738

  - name: agent-lab
    role: lab
    python: true
    packages: auto-review,mcp-server
    ref: d4bc1c9386f60324cc3f092261184040edfa3c3a

  - name: review-platform
    role: platform
    python: true
    ref: 9c62c8916b43bb35bd6452071a6ec028be882500
