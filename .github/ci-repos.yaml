# 統合 CI（ci.yml の windows・setup-sh ジョブ）が取り出すリポジトリと版（repos.yaml と同じ書き方）
# 他のリポジトリの main が変わってもこのリポジトリの CI が落ちたり結果が変わったりしないよう、ref をコミット SHA で固定する。
# 上げるとき: 各リポジトリの main の SHA に書き換えて PR を出す（CI がその組み合わせで setup を通すことを確かめる）。
# 項目は repos.yaml の一部で、name・role・python・cli・packages は repos.yaml と同じにする（tests/test_bootstrap.py で確かめる）。
# repos.yaml の python: true のリポジトリはすべてここに入れる（全ツールの一括インストールを CI で通すため。同じテストで確かめる）
org: shoyo-maya-bot
host: https://github.com

repos:
  - name: devtools-common
    role: library
    python: true
    ref: 2e25f8a11717ab387c7c2174d2a06b1a5eb37713

  - name: ai-coding
    role: guide
    python: true
    packages: tools/spec-trace
    ref: 0f930136437a481bd45cade165ec29e6d025376e

  - name: doc-to-markdown
    role: tool
    python: true
    cli: doc2md
    ref: a2220a7752e31c976d57cb5df743c8285a587306

  - name: office-review
    role: tool
    python: true
    cli: harness
    ref: d52c7200154939f14cb6e4ce59c3e223ae61ac88

  - name: design-diff
    role: tool
    python: true
    cli: design-diff
    ref: 8c50e15cbbd606f3e31184c9149c0529e7252c29

  - name: quality-analytics
    role: tool
    python: true
    cli: qa
    ref: d61a851950207739c164ff0750287a6229acfdf0

  - name: office-replace
    role: tool
    python: true
    cli: office-replace
    ref: 3d37e286949c5f0016964c493fc9d1f2da954c4f

  - name: backlog-report
    role: tool
    python: true
    cli: backlog-report
    ref: c84ab228b1f5c494793b48c62a9a799d50bc2409

  - name: slack-agenda-bot
    role: app
    python: true
    ref: 39565f891e49ec8c25e79a7d66bbd2984fc0b524

  - name: agent-lab
    role: lab
    python: true
    packages: auto-review,mcp-server
    ref: 0775b746494bd2e0ab261903c3bc0dd1ef31a5e7

  - name: review-platform
    role: platform
    python: true
    ref: 44533f35ba0d7198427a6674aba901766c379eaa
