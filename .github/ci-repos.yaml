# 統合 CI（ci.yml の windows・setup-sh ジョブ）が取り出すリポジトリと版（repos.yaml と同じ書き方）
# 他のリポジトリの main が変わってもこのリポジトリの CI が落ちたり結果が変わったりしないよう、ref をコミット SHA で固定する。
# 上げるとき: 各リポジトリの main の SHA に書き換えて PR を出す（CI がその組み合わせで setup を通すことを確かめる）。
# 項目は repos.yaml の一部で、name・role・python・cli・packages は repos.yaml と同じにする（tests/test_bootstrap.py で確かめる）。
# repos.yaml の python: true のリポジトリはすべてここに入れる（全ツールの一括インストールを CI で通すため。同じテストで確かめる）
org: shoyo-maya-bot
host: https://github.com

repos:
  - name: devtools-common
    role: library
    python: true
    ref: 6a263b894409a19a186d2b3b0b41da998174c0d6

  - name: ai-coding
    role: guide
    python: true
    packages: tools/spec-trace
    ref: f2d909f4b8e8121d3c5608db459fcf623d0b23e7

  - name: doc-to-markdown
    role: tool
    python: true
    cli: doc2md
    ref: 5a1e16c97d08049abdd4805f445ca8d15d1207c0

  - name: office-review
    role: tool
    python: true
    cli: harness
    ref: 6524af3cc13666f1df34bc60a4b6cf5e24733889

  - name: design-diff
    role: tool
    python: true
    cli: design-diff
    ref: 0969fb5ce2d21d90bb60cc7c77bc213cef2b576c

  - name: quality-analytics
    role: tool
    python: true
    cli: qa
    ref: 556587366bf5a501688415120c86dc0c61f5a791

  - name: office-replace
    role: tool
    python: true
    cli: office-replace
    ref: fb16deefb0153b64806193d283bf9202115e8d8b

  - name: backlog-report
    role: tool
    python: true
    cli: backlog-report
    ref: a2591ff34a1ae3749d4e3c5231aa550275c86dca

  - name: slack-agenda-bot
    role: app
    python: true
    ref: 52cec9cc08ec02c38b24fefac956672d0c2a1249

  - name: agent-lab
    role: lab
    python: true
    packages: auto-review,mcp-server
    ref: d4bc1c9386f60324cc3f092261184040edfa3c3a

  - name: review-platform
    role: platform
    python: true
    ref: 62b47f4cc106cdf352bc4f155c117fba86c49b16
