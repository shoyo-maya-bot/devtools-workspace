# 統合 CI（ci.yml の windows・setup-sh ジョブ）が取り出すリポジトリと版（repos.yaml と同じ書き方）
# 他のリポジトリの main が変わってもこのリポジトリの CI が落ちたり結果が変わったりしないよう、ref をコミット SHA で固定する。
# 上げるとき: 各リポジトリの main の SHA に書き換えて PR を出す（CI がその組み合わせで setup を通すことを確かめる）。
# 項目は repos.yaml の一部で、name・role・python・cli・packages は repos.yaml と同じにする（tests/test_bootstrap.py で確かめる）。
# repos.yaml の python: true のリポジトリはすべてここに入れる（全ツールの一括インストールを CI で通すため。同じテストで確かめる）
org: shoyo-maya-bot
host: https://github.com

repos:
  - name: devtools-common
    role: library
    python: true
    ref: 04f3915ab696d9312f1526dd11d5178dcd2601eb

  - name: ai-coding
    role: guide
    python: true
    packages: tools/spec-trace
    ref: b31351842c4b6d6f3149783bb09f8cd2b33de884

  - name: doc-to-markdown
    role: tool
    python: true
    cli: doc2md
    ref: a10ad8737ccb6bac6271ef67cef4d9c9ff0edfce

  - name: office-review
    role: tool
    python: true
    cli: harness
    ref: acbe9ad1c67a4c1bc19638d6bf9c6b705bdc7407

  - name: design-diff
    role: tool
    python: true
    cli: design-diff
    ref: 79587dab5678e42fcb0318e052889c698305eb74

  - name: quality-analytics
    role: tool
    python: true
    cli: qa
    ref: 676d0fce5cb9ef5ee980786de9bdf4075a3569f6

  - name: office-replace
    role: tool
    python: true
    cli: office-replace
    ref: 2e6b62a1bdbd9c49902a5d8dace2964f179e0252

  - name: backlog-report
    role: tool
    python: true
    cli: backlog-report
    ref: 3d7223492afa7c6ae7be75a649ecc3c5d104d620

  - name: slack-agenda-bot
    role: app
    python: true
    ref: 2fa3c87be9ae5c65710cc2f84c2e842e0b004900

  - name: agent-lab
