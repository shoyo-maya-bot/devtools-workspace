name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 統合のジョブ（windows・setup-sh）が取り出す他のリポジトリは .github/ci-repos.yaml の ref（コミット SHA）に固定する。
# 他のリポジトリの main が変わっても、このリポジトリの CI の結果は変わらない（上げるときは ci-repos.yaml を書き換える）
env:
  RUFF_VERSION: "0.15.11"
  BANDIT_VERSION: "1.8.6"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install "ruff==${RUFF_VERSION}" "bandit==${BANDIT_VERSION}"
      - run: ruff check scripts tests && ruff format --check scripts tests
      # SAST。このリポジトリは標準ライブラリだけで依存が無いため、pip-audit は流さない
      - name: SAST (bandit)
        run: bandit -q -r scripts -ll
      - name: Manifest / bootstrap tests
        run: python -m unittest discover -s tests -v

  # 利用者は Windows。入口（install-prereqs.cmd / setup.cmd）が実際に動くことを Windows のランナーで確かめる
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    # setup.cmd / install-prereqs.cmd は環境変数 CI が定義されていれば最後の pause をしない（GitHub Actions は自動で CI=true）
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: .cmd / .bat / .ps1 are CRLF in the Windows checkout
        run: |
          git ls-files --eol -- '*.cmd' '*.bat' '*.ps1'
          $bad = git ls-files --eol -- '*.cmd' '*.bat' '*.ps1' | Where-Object { $_ -notmatch 'w/crlf' }
          if ($bad) { $bad | ForEach-Object { Write-Output "::error::CRLF ではありません: $_" }; exit 1 }

      - name: Unit tests (Windows)
        run: python -m unittest discover -s tests -v

      - name: PSScriptAnalyzer
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          # Write-Host は利用者向けの色付き表示のために使っているので対象外にする
          $r = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error, Warning -ExcludeRule PSAvoidUsingWriteHost
          $r | Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message | Out-String -Width 300
          foreach ($x in $r) { Write-Output "::error file=$($x.ScriptPath),line=$($x.Line)::$($x.RuleName): $($x.Message)" }
          if ($r) { exit 1 }

      - name: install-prereqs.cmd -Check (reports only; 0 = all present, 1 = missing)
        shell: cmd
        run: |
          call install-prereqs.cmd -Check
          if errorlevel 2 exit /b 1
          exit /b 0

      - name: install-prereqs.cmd -DryRun (no changes)
        shell: cmd
        run: call install-prereqs.cmd -DryRun

      - name: setup.cmd -Only devtools-common,doc-to-markdown (versions pinned by .github/ci-repos.yaml)
        shell: cmd
        run: call setup.cmd -Manifest .github\ci-repos.yaml -Only devtools-common,doc-to-markdown

      - name: setup.cmd again (already cloned → pull, idempotent)
        shell: cmd
        run: call setup.cmd -Manifest .github\ci-repos.yaml -Only devtools-common,doc-to-markdown

      - name: Smoke test the installed tools
        # ランナーの既定の文字コード（cp1252）では日本語のヘルプを書けないため UTF-8 にする（日本語の Windows は cp932 で表示できる）
        env:
          PYTHONUTF8: "1"
        run: |
          $venv = Join-Path (Split-Path $PWD -Parent) ".venv\Scripts"
          & "$venv\doc2md.exe" --help; if ($LASTEXITCODE) { exit 1 }
          & "$venv\figspec.exe" --help; if ($LASTEXITCODE) { exit 1 }
          & "$venv\python.exe" -c "import devtools_common; print('devtools_common', devtools_common.__file__)"; if ($LASTEXITCODE) { exit 1 }
          python scripts\bootstrap.py --manifest .github\ci-repos.yaml --only devtools-common,doc-to-markdown status

  # macOS・Linux の入口（setup.sh）が実際に動くことを確かめる。Python の版の確認（3.11 以上）もここを通る
  setup-sh:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: setup.sh (versions pinned by .github/ci-repos.yaml)
        run: ./setup.sh --manifest .github/ci-repos.yaml --only devtools-common,doc-to-markdown
      - name: setup.sh again (already cloned → pull, idempotent)
        run: ./setup.sh --manifest .github/ci-repos.yaml --only devtools-common,doc-to-markdown
      - name: Smoke test the installed tools
        run: |
          venv="$(dirname "$PWD")/.venv/bin"
          "$venv/doc2md" --help >/dev/null
          "$venv/figspec" --help >/dev/null
          "$venv/python" -c "import devtools_common; print('devtools_common', devtools_common.__file__)"
          # 取り出した版が ci-repos.yaml の ref と同じか
          python3 - <<'PY'
          import subprocess, sys
          sys.path.insert(0, "scripts")
          import bootstrap
          _, repos = bootstrap.load_manifest(bootstrap.Path(".github/ci-repos.yaml"))
          for r in repos:
              head = subprocess.run(["git", "rev-parse", "HEAD"], cwd=f"../{r.name}", capture_output=True, text=True, check=True).stdout.strip()
              print(r.name, head)
              assert head == r.ref, f"{r.name}: {head} != {r.ref}"
          PY
