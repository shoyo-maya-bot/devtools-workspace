# 共通のリリース（再利用可能ワークフロー）。devtools-workspace に置き、各ツールから SHA 固定で呼ぶ
#
# v* タグの push で呼び出す。タグと pyproject.toml の version が一致しなければ失敗する。
# wheel / sdist を GitHub Release に添付する（利用者は pipx install <wheel URL> や Git タグ指定で導入）。
name: python-release

on:
  workflow_call:
    secrets:
      DEPS_TOKEN:
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Tag must match project version
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version v$version"
            exit 1
          fi
      - run: pip install "build==1.3.0"  # 版を固定（上げるときはここを書き換える）
      - run: python -m build
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
