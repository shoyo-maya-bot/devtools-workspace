# 共通のリリース（再利用可能ワークフロー）。devtools-workspace に置き、各ツールから SHA 固定で呼ぶ
#
# v* タグの push で呼び出す。タグと pyproject.toml の version が一致しなければ失敗する。
# wheel / sdist を GitHub Release に添付する（利用者は pipx install <wheel URL> や Git タグ指定で導入）。
name: python-release

on:
  workflow_call:
    secrets:
      DEPS_TOKEN:
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Tag must match project version
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version v$version"
            exit 1
          fi
      - run: pip install build
      - run: python -m build
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
