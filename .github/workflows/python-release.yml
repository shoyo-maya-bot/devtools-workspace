# 共通のリリース（再利用可能ワークフロー）。devtools-workspace に置き、各ツールから SHA 固定で呼ぶ
#
# v* タグの push で呼び出す。タグと pyproject.toml の version が一致しなければ失敗する。
# wheel / sdist を GitHub Release に添付する（利用者は pipx install <wheel URL> や Git タグ指定で導入）。
name: python-release

on:
  workflow_call:
    secrets:
      DEPS_TOKEN:
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Tag must match project version
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version v$version"
            exit 1
          fi
      # build と、build が隔離環境に入れる build backend（setuptools など）の版を固定する。
      # PIP_CONSTRAINT は pip の全呼び出し（build の隔離環境の中の pip も含む）に効くので、backend の版もここで決まる。
      # 呼び出し側に constraints.txt があればそれも足す（実行時の依存の版はそちらで固定している）。上げるときは下の一覧を書き換える
      - name: Pin build tools and build backend
        run: |
          cat > "$RUNNER_TEMP/build-constraints.txt" <<'TXT'
          build==1.3.0
          packaging==26.3
          pyproject_hooks==1.2.0
          setuptools==84.0.0
          wheel==0.47.0
          TXT
          constraints="$RUNNER_TEMP/build-constraints.txt"
          if [ -f constraints.txt ]; then constraints="$constraints $PWD/constraints.txt"; echo "constraints.txt も使います"; fi
          echo "PIP_CONSTRAINT=$constraints" >> "$GITHUB_ENV"
      - run: pip install "build==1.3.0"  # 上の一覧と同じ版
      - name: Build (backend from the pinned constraints)
        run: |
          python -m build
          # 固定した backend で作られたことを wheel の WHEEL ファイルで確かめる
          python - <<'PY'
          import glob, sys, zipfile
          for whl in glob.glob("dist/*.whl"):
              with zipfile.ZipFile(whl) as z:
                  meta = next(n for n in z.namelist() if n.endswith(".dist-info/WHEEL"))
                  gen = next(l for l in z.read(meta).decode().splitlines() if l.startswith("Generator:"))
              print(whl, gen)
              if "setuptools (84.0.0)" not in gen:
                  sys.exit(f"::error::{whl} は固定した setuptools 84.0.0 で作られていません（{gen}）")
          PY
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
