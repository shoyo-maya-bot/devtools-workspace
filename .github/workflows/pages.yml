name: pages

# devtools 武具屋（armory/）を GitHub Pages に出す。
# リポジトリの Settings → Pages の Source は「GitHub Actions」にしておく。
on:
  push:
    branches: [main]
    paths:
      - "armory/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: assemble site
        run: |
          mkdir -p _site
          cp -r armory _site/armory
          # トップに来た人は武具屋へ
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>devtools</title>' \
            '<meta http-equiv="refresh" content="0; url=armory/">' \
            '<a href="armory/">devtools 武具屋へ</a>' > _site/index.html
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
