# 共通の Python CI（再利用可能ワークフロー）。devtools-workspace に置き、各ツールから呼ぶ
#
# 各ツールリポジトリの .github/workflows/ci.yml から、コミット SHA で固定して呼び出す:
#
#   jobs:
#     ci:
#       uses: shoyo-maya-bot/devtools-workspace/.github/workflows/python-ci.yml@<コミット SHA>
#       with:
#         extra-apt-packages: "libreoffice-writer-nogui"
#       secrets: inherit
#
# 品質ゲート: lint（ruff check）/ format（ruff format --check）/ test（pytest, 複数 Python）
#            / セキュリティ（bandit による SAST、pip-audit による依存脆弱性）
name: python-ci

on:
  workflow_call:
    inputs:
      python-versions:
        description: テストする Python のバージョン（JSON 配列）
        type: string
        default: '["3.10", "3.12"]'
      extra-apt-packages:
        description: テスト前に apt で入れるパッケージ（空白区切り）
        type: string
        default: ""
      source-dir:
        description: SAST の対象ディレクトリ
        type: string
        default: src
      run-security:
        type: boolean
        default: true
    secrets:
      DEPS_TOKEN:
        description: 非公開の依存リポジトリ（devtools-common 等）を読むためのトークン（read-only）
        required: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.python-versions) }}
    env:
      DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        if: inputs.extra-apt-packages != ''
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ${{ inputs.extra-apt-packages }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Access private dependency repositories
        if: env.DEPS_TOKEN != ''
        run: git config --global url."https://x-access-token:${DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  security:
    if: inputs.run-security
    runs-on: ubuntu-latest
    env:
      DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Access private dependency repositories
        if: env.DEPS_TOKEN != ''
        run: git config --global url."https://x-access-token:${DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
      - run: pip install -e . bandit pip-audit
      - name: SAST (bandit)
        run: bandit -q -r ${{ inputs.source-dir }} -ll
      - name: Dependency vulnerabilities (pip-audit)
        run: pip-audit --skip-editable --progress-spinner off
