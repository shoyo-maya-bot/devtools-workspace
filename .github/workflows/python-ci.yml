# 共通の Python CI（再利用可能ワークフロー）。devtools-workspace に置き、各ツールから呼ぶ
#
# 各ツールリポジトリの .github/workflows/ci.yml から、コミット SHA で固定して呼び出す:
#
#   jobs:
#     ci:
#       uses: shoyo-maya-bot/devtools-workspace/.github/workflows/python-ci.yml@<コミット SHA>
#       with:
#         extra-apt-packages: "libreoffice-writer-nogui"
#       secrets:
#         DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}   # 非公開の依存があるときだけ。無ければ secrets ごと書かない
#
# `secrets: inherit` は使わない（呼び出し側のシークレットがすべてこのワークフローに渡るため）。必要なものだけを名前で渡す。
#
# 品質ゲート: lint（ruff check）/ format（ruff format --check）/ test（pytest, 複数 Python。Windows でも）
#            / セキュリティ（bandit による SAST、pip-audit による依存脆弱性）
# 依存の版: リポジトリに constraints.txt があれば、pip install に `-c constraints.txt` を付ける
# ツールの版（ruff・bandit・pip-audit）は下の env で固定する。上げるときはここを書き換え、呼び出し側の SHA を上げる
# inputs（文字列）は run: に `${{ inputs.… }}` で直接埋め込まず、手順の env: で渡してシェル変数として使う
# （埋め込むと値がスクリプトの一部として解釈され、`; curl …` のような値でコマンドを注入できるため）。
# inputs の名前・型・既定値は呼び出し側（SHA で固定）との約束なので変えない
name: python-ci

on:
  workflow_call:
    inputs:
      python-versions:
        description: テストする Python のバージョン（JSON 配列。ubuntu で流す）
        type: string
        default: '["3.10", "3.12"]'
      extra-apt-packages:
        description: テスト前に apt で入れるパッケージ（空白区切り。ubuntu だけ）
        type: string
        default: ""
      source-dir:
        description: SAST の対象ディレクトリ
        type: string
        default: src
      run-security:
        type: boolean
        default: true
      run-windows:
        description: Windows（windows-latest）でもテストを流す（利用者の多くは Windows のため既定でオン）
        type: boolean
        default: true
      windows-python-version:
        description: Windows で使う Python のバージョン
        type: string
        default: "3.12"
    secrets:
      DEPS_TOKEN:
        description: 非公開の依存リポジトリ（devtools-common 等）を読むためのトークン（read-only）。依存のインストールの手順だけで使う
        required: false

permissions:
  contents: read

env:
  RUFF_VERSION: "0.15.11"
  BANDIT_VERSION: "1.8.6"
  PIP_AUDIT_VERSION: "2.9.0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install "ruff==${RUFF_VERSION}"
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system packages
        if: inputs.extra-apt-packages != ''
        env:
          EXTRA_APT_PACKAGES: ${{ inputs.extra-apt-packages }}
        run: |
          # 空白区切りのパッケージ名だけを受け付ける（オプション `-…` やシェルの記号は通さない）
          read -r -a pkgs <<< "$EXTRA_APT_PACKAGES"
          for p in "${pkgs[@]}"; do
            if [[ ! "$p" =~ ^[a-z0-9][a-z0-9.+:=~-]*$ ]]; then
              echo "::error::extra-apt-packages に使えない名前があります: $p"
              exit 1
            fi
          done
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends "${pkgs[@]}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install (DEPS_TOKEN はこの手順の中だけで使い、ファイルに書かない)
        env:
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: |
          # git の設定ファイル（~/.gitconfig）に書かず、この手順のプロセスの環境変数だけで認証付きの URL に置き換える
          if [ -n "$DEPS_TOKEN" ]; then
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0="url.https://x-access-token:${DEPS_TOKEN}@github.com/.insteadOf"
            export GIT_CONFIG_VALUE_0="https://github.com/"
          fi
          c=(); if [ -f constraints.txt ]; then c=(-c constraints.txt); echo "constraints.txt を使います"; fi
          pip install -e ".[dev]" "${c[@]}"
      - run: pytest -q

  # 利用者の多くは Windows。パス・改行・文字コードの違いで落ちないかを確かめる（extra-apt-packages は入れない）
  test-windows:
    if: inputs.run-windows
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    # PYTHONUTF8 は付けない（open() の encoding 忘れなど、文字コードの誤りをここで見つけるため）
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.windows-python-version }}
          cache: pip
      - name: Install (DEPS_TOKEN はこの手順の中だけで使い、ファイルに書かない)
        env:
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: |
          # git の設定ファイル（~/.gitconfig）に書かず、この手順のプロセスの環境変数だけで認証付きの URL に置き換える
          if [ -n "$DEPS_TOKEN" ]; then
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0="url.https://x-access-token:${DEPS_TOKEN}@github.com/.insteadOf"
            export GIT_CONFIG_VALUE_0="https://github.com/"
          fi
          c=(); if [ -f constraints.txt ]; then c=(-c constraints.txt); echo "constraints.txt を使います"; fi
          pip install -e ".[dev]" "${c[@]}"
      - run: pytest -q

  security:
    if: inputs.run-security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the project (DEPS_TOKEN はこの手順の中だけで使い、ファイルに書かない)
        env:
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: |
          if [ -n "$DEPS_TOKEN" ]; then
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0="url.https://x-access-token:${DEPS_TOKEN}@github.com/.insteadOf"
            export GIT_CONFIG_VALUE_0="https://github.com/"
          fi
          c=(); if [ -f constraints.txt ]; then c=(-c constraints.txt); fi
          pip install -e . "${c[@]}"
      # 検査ツールはトークンの無い手順で、版を固定して入れる
      - run: pip install "bandit==${BANDIT_VERSION}" "pip-audit==${PIP_AUDIT_VERSION}"
      - name: SAST (bandit)
        env:
          SOURCE_DIR: ${{ inputs.source-dir }}
        run: |
          # 空白区切りで複数のフォルダも書ける（従来どおり）。値はシェルの文として解釈しない
          read -r -a dirs <<< "$SOURCE_DIR"
          bandit -q -r -ll -- "${dirs[@]}"
      - name: Dependency vulnerabilities (pip-audit)
        run: pip-audit --skip-editable --progress-spinner off
